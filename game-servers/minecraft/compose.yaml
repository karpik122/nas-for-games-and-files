name: karpiknas-games

services:
  minecraft:
    image: itzg/minecraft-server:latest
    pull_policy: missing
    container_name: karpiknas-minecraft
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 2m
    ports:
      - "${MINECRAFT_PORT:-25565}:25565/tcp"
    environment:
      EULA: "${MINECRAFT_EULA:-FALSE}"
      TYPE: "${MINECRAFT_TYPE:-PAPER}"
      VERSION: "${MINECRAFT_VERSION:-LATEST}"
      MEMORY: "${MINECRAFT_MEMORY:-4G}"
      ONLINE_MODE: "TRUE"
      ENABLE_RCON: "FALSE"
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      GAME_DATABASE_HOST: "database"
      GAME_DATABASE_PORT: "3306"
      GAME_DATABASE_NAME: "${MINECRAFT_DB_NAME:-minecraft}"
      GAME_DATABASE_USER: "${MINECRAFT_DB_USER:-minecraft}"
      GAME_DATABASE_PASSWORD_FILE: "/run/secrets/minecraft_db_password"
      USE_AIKAR_FLAGS: "TRUE"
      TZ: "${TZ:-Europe/Warsaw}"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    secrets:
      - minecraft_db_password
    networks:
      - game-internal

  database:
    image: mariadb:lts
    pull_policy: missing
    container_name: karpiknas-minecraft-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${MINECRAFT_DB_NAME:-minecraft}"
      MARIADB_USER: "${MINECRAFT_DB_USER:-minecraft}"
      MARIADB_PASSWORD_FILE: "/run/secrets/minecraft_db_password"
      MARIADB_ROOT_PASSWORD_FILE: "/run/secrets/minecraft_db_root_password"
      MARIADB_AUTO_UPGRADE: "1"
      TZ: "${TZ:-Europe/Warsaw}"
    volumes:
      - minecraft-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    secrets:
      - minecraft_db_password
      - minecraft_db_root_password
    networks:
      - game-internal

volumes:
  minecraft-db-data:

secrets:
  minecraft_db_password:
    file: ./.secrets/minecraft_db_password
  minecraft_db_root_password:
    file: ./.secrets/minecraft_db_root_password

networks:
  game-internal:
    driver: bridge
